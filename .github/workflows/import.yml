name: Import Issues (Resume)
on: workflow_dispatch
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Import via Python (Fortsetzung)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > import.py
          import json
          import subprocess
          import time

          # Zuweisung der Unterkategorien zu deinen 5 Haupt-Labels
          label_map = {
              "scope: campingplätze": "scope: urlaube",
              "scope: rastplätze": "scope: urlaube",
              "scope: transportmittel": "scope: urlaube",
              "scope: checklisten": "scope: packliste",
              "scope: mein-profil": "scope: config",
              "scope: konfiguration": "scope: config",
              "scope: integrationen": "scope: config",
              "scope: integration": "scope: config",
              "scope: kategorien": "scope: config",
              "scope: tags": "scope: config",
              "scope: mitreisende": "scope: config",
              "scope: datensicherung": "scope: config"
          }

          with open('camping_app_issues.json', 'r', encoding='utf-8-sig') as f:
              issues = json.load(f)

          # Startet exakt bei Index 36 (also dem 37. Issue in der Liste)
          for i, issue in enumerate(issues[36:], 37):
              print(f"[{i}/{len(issues)}] Erstelle: {issue['title'][:50]}...")
              
              cmd = [
                  'gh', 'issue', 'create',
                  '--title', issue['title'],
                  '--body', issue['body']
              ]
              
              for label in issue['labels']:
                  # Tauscht das Label aus, falls es im Dictionary steht
                  mapped_label = label_map.get(label, label)
                  cmd.extend(['--label', mapped_label])
                  
              subprocess.run(cmd, check=True)
              time.sleep(1.5)
          EOF
          
          python import.py
