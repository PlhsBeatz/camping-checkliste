name: Import Issues
on: workflow_dispatch
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Import via Python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > import.py
          import json
          import subprocess
          import time

          # utf-8-sig filtert eventuelle unsichtbare Zeichen am Dateianfang heraus
          with open('camping_app_issues.json', 'r', encoding='utf-8-sig') as f:
              issues = json.load(f)

          for i, issue in enumerate(issues, 1):
              print(f"[{i}/{len(issues)}] Erstelle: {issue['title'][:50]}...")
              
              cmd = [
                  'gh', 'issue', 'create',
                  '--title', issue['title'],
                  '--body', issue['body']
              ]
              
              # Labels einzeln anhängen
              for label in issue['labels']:
                  cmd.extend(['--label', label])
                  
              subprocess.run(cmd, check=True)
              time.sleep(1.5)  # Kurze Pause für das GitHub API-Limit
          EOF
          
          python import.py
